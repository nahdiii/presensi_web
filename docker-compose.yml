# Lingkungan pengembangan lokal. Kode di-mount, jadi perubahan langsung terlihat.
#   docker compose up -d
#   docker compose exec app php artisan migrate --seed
# Web/admin: http://localhost:8090/admin · API: http://localhost:8090/api/v1
x-php: &php
  build:
    context: docker
    dockerfile: Dockerfile
  image: presensi-php:dev
  volumes:
    - .:/var/www/html
  depends_on:
    - postgres

services:
  app:
    <<: *php
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8090:8000"

  worker:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=5

  scheduler:
    <<: *php
    command: php artisan schedule:work

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: presensi
      POSTGRES_USER: presensi
      POSTGRES_PASSWORD: presensi
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
